<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진도계획표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;padding:1.5rem;color:#1a1a1a}
h1{font-size:18px;font-weight:500;margin-bottom:0.5rem;color:#1a1a1a;display:flex;align-items:center;gap:10px}
#sync-badge{font-size:11px;font-weight:400;padding:2px 8px;border-radius:20px;background:#e8f0fb;color:#1a5fb4}
.top-bar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap;margin-top:0.75rem}
.top-bar button{font-size:13px;padding:4px 14px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;cursor:pointer;height:32px}
.top-bar button:hover{background:#f0f0ee}
.legend{display:flex;gap:12px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#666}
.legend-dot{width:14px;height:14px;border-radius:3px}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:12px;border:0.5px solid #ddd;padding:1rem}
table{border-collapse:collapse;font-size:13px}
th,td{border:0.5px solid #ddd;white-space:nowrap}
th{background:#f5f5f3;color:#666;font-weight:500;text-align:center;vertical-align:top;padding:6px 8px}
th.topic-input-cell{padding:4px}
th.topic-input-cell input{width:72px;font-size:11px;padding:3px 5px;border:0.5px solid #ddd;border-radius:4px;background:#fff;color:#1a1a1a;text-align:center}
th.seq-label{font-size:12px;font-weight:500;display:block;margin-bottom:3px}
td.class-name{background:#f5f5f3;font-weight:500;color:#1a1a1a;text-align:left;min-width:120px;font-size:12px;padding:6px 8px}
td.cell{text-align:center;cursor:pointer;min-width:80px;color:#1a1a1a;font-size:12px;padding:0;vertical-align:middle}
td.done{background:#B5D4F4}
td.perf{background:#FAC775}
td.done.perf{background:linear-gradient(135deg,#B5D4F4 50%,#FAC775 50%)}
.cell-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 4px 3px;gap:3px;min-height:38px}
.cell-date{font-size:12px;color:#1a1a1a;min-height:16px}
td.done .cell-date{color:#0C447C}
td.perf .cell-date{color:#633806}
.cell-empty .cell-date{color:#bbb}
.cell-btns{display:flex;gap:3px}
.cbtn{width:16px;height:16px;border-radius:3px;border:0.5px solid rgba(0,0,0,0.15);cursor:pointer;flex-shrink:0;opacity:0.6}
.cbtn:hover{opacity:1}
.cbtn-blue{background:#B5D4F4}
.cbtn-yellow{background:#FAC775}
.cbtn.active{opacity:1;border-color:rgba(0,0,0,0.4);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.1)}
.cell-input-wrap{display:flex;flex-direction:column;align-items:center;padding:3px 4px;gap:3px}
.cell-inline-input{width:60px;font-size:12px;padding:2px 4px;border:0.5px solid #85B7EB;border-radius:4px;text-align:center;outline:none;background:#fff;color:#1a1a1a}
</style>
</head>
<body>
<h1>진도계획표 <span id="sync-badge">연결 중...</span></h1>
<div class="top-bar">
  <button id="btn-add">+ 차시 추가</button>
  <button id="btn-remove">− 마지막 차시 삭제</button>
</div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#B5D4F4;border:0.5px solid #85B7EB"></div>수업 완료</div>
  <div class="legend-item"><div class="legend-dot" style="background:#FAC775;border:0.5px solid #EF9F27"></div>수행평가</div>
  <div class="legend-item" style="font-size:12px;color:#aaa">셀 클릭 → 날짜 입력 · 파랑/노랑 버튼으로 색칠</div>
</div>
<div class="tbl-wrap"><table id="tbl"></table></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBrFfj_6OYJoWO2Br_xNuYQdCsN0XFaLjg",
  authDomain: "jindo-2026-1.firebaseapp.com",
  projectId: "jindo-2026-1",
  storageBucket: "jindo-2026-1.firebasestorage.app",
  messagingSenderId: "112802983410",
  appId: "1:112802983410:web:9ff33e868b6a446c094f6b",
  measurementId: "G-ZENF5WES5Y"
};

const CLASSES = [
  "경제2-4 월화금","경제2-5 화목금","정치",
  "사탐3-2S 월목","사탐3-6T 수목","사탐3-9R 화수"
];

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);
const stateRef = doc(db, 'jindo', 'state');

let state = { cellData:{}, numSeq:10, topics:{} };
let editingKey = null;

const badge = document.getElementById('sync-badge');

function setSyncBadge(s) {
  if(s==='ok'){badge.textContent='동기화됨';badge.style.background='#eafaf1';badge.style.color='#1a7c4a';}
  else if(s==='saving'){badge.textContent='저장 중...';badge.style.background='#fef9e7';badge.style.color='#b7770d';}
  else{badge.textContent='연결 오류';badge.style.background='#fdecea';badge.style.color='#c0392b';}
}

async function persist() {
  setSyncBadge('saving');
  try {
    await setDoc(stateRef, { cellData: state.cellData, numSeq: state.numSeq, topics: state.topics, updatedAt: new Date() });
  } catch(e){ setSyncBadge('error'); }
}

onSnapshot(stateRef, snap => {
  if(snap.exists()) {
    const d = snap.data();
    state.cellData = d.cellData || {};
    state.numSeq = d.numSeq || 10;
    state.topics = d.topics || {};
  }
  setSyncBadge('ok');
  render();
}, () => setSyncBadge('error'));

function cellKey(cls, idx){ return cls+'||'+idx; }

function render() {
  const tbl = document.getElementById('tbl');
  let html = '<thead><tr><th style="min-width:120px;text-align:left;vertical-align:middle">반</th>';
  for(let i=0;i<state.numSeq;i++){
    const t = (state.topics[i]||'').replace(/"/g,'&quot;');
    html += `<th class="topic-input-cell"><span class="seq-label">${i+1}차시</span><input type="text" placeholder="주제" value="${t}" data-seq="${i}"/></th>`;
  }
  html += '</tr></thead><tbody>';
  CLASSES.forEach(cls => {
    html += `<tr><td class="class-name">${cls}</td>`;
    for(let i=0;i<state.numSeq;i++){
      const k = cellKey(cls,i);
      const d = state.cellData[k]||{};
      let tdCls='cell';
      if(d.done) tdCls+=' done';
      if(d.perf) tdCls+=' perf';
      if(!d.date&&!d.done&&!d.perf) tdCls+=' cell-empty';
      const dateVal = (d.date||'').replace(/"/g,'&quot;');
      const blueCls = 'cbtn cbtn-blue'+(d.done?' active':'');
      const yelCls  = 'cbtn cbtn-yellow'+(d.perf?' active':'');
      if(editingKey===k){
        html += `<td class="${tdCls}" data-key="${k}">
          <div class="cell-input-wrap">
            <input class="cell-inline-input" type="text" value="${dateVal}" placeholder="6/9" maxlength="10" data-key="${k}"/>
            <div class="cell-btns">
              <div class="${blueCls}" data-key="${k}" data-type="done"></div>
              <div class="${yelCls}" data-key="${k}" data-type="perf"></div>
            </div>
          </div>
        </td>`;
      } else {
        html += `<td class="${tdCls}" data-key="${k}">
          <div class="cell-inner">
            <span class="cell-date">${d.date||'—'}</span>
            <div class="cell-btns">
              <div class="${blueCls}" data-key="${k}" data-type="done"></div>
              <div class="${yelCls}" data-key="${k}" data-type="perf"></div>
            </div>
          </div>
        </td>`;
      }
    }
    html += '</tr>';
  });
  html += '</tbody>';
  tbl.innerHTML = html;

  tbl.querySelectorAll('td.cell').forEach(td => {
    td.addEventListener('click', e => {
      if(e.target.classList.contains('cbtn')||e.target.classList.contains('cell-inline-input')) return;
      const k = td.dataset.key;
      if(editingKey===k) return;
      editingKey = k;
      render();
      setTimeout(()=>{
        const inp = tbl.querySelector(`.cell-inline-input[data-key="${CSS.escape(k)}"]`);
        if(inp){ inp.focus(); inp.select(); }
      },30);
    });
  });

  tbl.querySelectorAll('.cell-inline-input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if(e.key==='Enter'){
        const k = inp.dataset.key;
        if(!state.cellData[k]) state.cellData[k]={};
        state.cellData[k].date = inp.value.trim();
        editingKey = null;
        persist(); render();
      }
      if(e.key==='Escape'){ editingKey=null; render(); }
      e.stopPropagation();
    });
    inp.addEventListener('blur', () => {
      setTimeout(()=>{
        if(editingKey===inp.dataset.key){
          const k = inp.dataset.key;
          if(!state.cellData[k]) state.cellData[k]={};
          state.cellData[k].date = inp.value.trim();
          editingKey=null; persist(); render();
        }
      },150);
    });
    inp.addEventListener('click', e => e.stopPropagation());
  });

  tbl.querySelectorAll('.cbtn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const k = btn.dataset.key;
      const type = btn.dataset.type;
      if(!state.cellData[k]) state.cellData[k]={};
      state.cellData[k][type] = !state.cellData[k][type];
      persist(); render();
    });
  });

  tbl.querySelectorAll('input[data-seq]').forEach(inp => {
    inp.addEventListener('change', () => { state.topics[inp.dataset.seq]=inp.value; persist(); });
    inp.addEventListener('click', e => e.stopPropagation());
  });
}

document.getElementById('btn-add').onclick = () => { state.numSeq++; persist(); render(); };
document.getElementById('btn-remove').onclick = () => {
  if(state.numSeq<=1) return;
  state.numSeq--; persist(); render();
};
</script>
</body>
</html>
